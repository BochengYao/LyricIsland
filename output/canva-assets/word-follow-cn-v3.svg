      <stop offset="0" stop-color="#344d4d" stop-opacity=".5"/>
      <stop offset="1" stop-color="#11100f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf2fb"/>
      <stop offset=".58" stop-color="#f4f1ee"/>
      <stop offset="1" stop-color="#d8ecea"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4775c"/><stop offset="1" stop-color="#f8b76f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-80%" width="140%" height="260%"><feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#000" flood-opacity=".34"/></filter>
    <clipPath id="progress"><rect x="0" y="0" width="770" height="110"/></clipPath>
    <clipPath id="stageclip"><rect x="90" y="510" width="1740" height="340" rx="44"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#11100f"/>
