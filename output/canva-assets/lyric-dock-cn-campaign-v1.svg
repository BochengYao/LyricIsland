<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <clipPath id="poster"><rect width="1920" height="1080"/></clipPath>
    <clipPath id="desktopClip"><path d="M 544 604 H 1948 V 1100 H 492 V 656 C 492 624 512 604 544 604 Z"/></clipPath>
    <filter id="desktopShadow" x="-15%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>

  <g clip-path="url(#poster)">
    <rect width="1920" height="1080" fill="#111110"/>

    <text x="132" y="92" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#f5f1ec">Lyric Hover 歌词岛</text>

    <text x="128" y="244" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="112" font-weight="800" fill="#ffffff" letter-spacing="-5">
      <tspan x="128" dy="0">窗口留给工作，</tspan>
      <tspan x="128" dy="128">歌词留在底部。</tspan>
    </text>

    <text x="136" y="490" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="500" fill="#ffffff" opacity=".78">无需展开窗口，歌词安静停留在任务栏。</text>

    <path d="M 1190 142 C 1374 262, 1210 424, 1344 530 C 1430 598, 1512 648, 1490 772 C 1475 858, 1378 882, 1308 927" fill="none" stroke="#ef765c" stroke-width="2.2" stroke-linecap="round"/>

    <g filter="url(#desktopShadow)">
      <path d="M 544 604 H 1948 V 1100 H 492 V 656 C 492 624 512 604 544 604 Z" fill="#ebe9e6"/>
    </g>

    <g clip-path="url(#desktopClip)">
      <rect x="492" y="604" width="1456" height="496" fill="#ebe9e6"/>
      <rect x="586" y="674" width="906" height="246" rx="24" fill="#faf9f7"/>
      <rect x="586" y="674" width="906" height="50" rx="24" fill="#dedbd7"/>
      <rect x="586" y="704" width="906" height="20" fill="#dedbd7"/>
      <circle cx="626" cy="699" r="7" fill="#aaa7a2"/>
      <circle cx="652" cy="699" r="7" fill="#aaa7a2" opacity=".72"/>
      <rect x="628" y="770" width="284" height="16" rx="8" fill="#cbc8c4"/>
      <rect x="628" y="810" width="674" height="13" rx="6.5" fill="#dedbd7"/>
      <rect x="628" y="846" width="544" height="13" rx="6.5" fill="#dedbd7" opacity=".82"/>
      <rect x="628" y="882" width="610" height="13" rx="6.5" fill="#dedbd7" opacity=".62"/>

      <rect x="492" y="920" width="1456" height="180" fill="#1a1a19"/>
      <rect x="492" y="920" width="1456" height="2" fill="#ffffff" opacity=".15"/>

      <g transform="translate(550 976)" stroke="#ffffff" stroke-width="4" fill="none" opacity=".92">
        <rect x="0" y="0" width="18" height="18"/>
        <rect x="25" y="0" width="18" height="18"/>
        <rect x="0" y="25" width="18" height="18"/>
        <rect x="25" y="25" width="18" height="18"/>
      </g>
      <circle cx="646" cy="997" r="25" fill="#ffffff" opacity=".10"/>
      <circle cx="716" cy="997" r="25" fill="#ffffff" opacity=".10"/>
      <rect x="760" y="972" width="48" height="48" rx="11" fill="#ffffff" opacity=".10"/>

      <text x="1220" y="988" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#ffffff">路灯亮起时，旋律还留在这里</text>
      <text x="1220" y="1034" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="500" fill="#ffffff" opacity=".46">歌词坞</text>

      <g transform="translate(1740 976)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".82">
        <path d="M0 20c10-11 21-11 31 0"/>
        <path d="M7 28c5-6 12-6 17 0"/>
        <circle cx="15.5" cy="36" r="2.3" fill="#ffffff" stroke="none"/>
      </g>
      <text x="1904" y="992" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">22:18</text>
      <text x="1904" y="1025" text-anchor="end" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" opacity=".55">2026/09/14</text>
    </g>

    <circle cx="1308" cy="927" r="7" fill="#ef765c"/>
