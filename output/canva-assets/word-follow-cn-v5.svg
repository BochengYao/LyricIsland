  <text x="112" y="318" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="500" fill="#fff" fill-opacity=".68">未唱部分保持低亮，唱到哪里，歌词就逐字亮到哪里。</text>
