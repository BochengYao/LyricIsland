<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <clipPath id="screenClip"><rect x="96" y="570" width="1728" height="462" rx="28"/></clipPath>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f5"/>
      <stop offset="1" stop-color="#e4e8ec"/>
    </linearGradient>
    <filter id="screenShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1a1a19" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#f5f2ee"/>

  <text x="118" y="106" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#151514" letter-spacing=".5">Lyric Hover</text>

  <text x="118" y="258" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="112" font-weight="800" fill="#151514" letter-spacing="-5">
    <tspan x="118" dy="0">窗口留给工作，</tspan>
    <tspan x="118" dy="132">歌词留在底部。</tspan>
  </text>

  <text x="1240" y="300" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="500" fill="#252523">
    <tspan x="1240" dy="0">实时歌词安静留在任务栏，</tspan>
    <tspan x="1240" dy="46">不遮挡当前窗口；</tspan>
    <tspan x="1240" dy="46">长句也会自然滚动。</tspan>
  </text>

