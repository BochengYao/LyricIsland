<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="glow" cx="78%" cy="88%" r="66%">
      <stop offset="0" stop-color="#66d6d0" stop-opacity=".7"/>
      <stop offset=".48" stop-color="#365354" stop-opacity=".2"/>
      <stop offset="1" stop-color="#11100f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4775c"/><stop offset="1" stop-color="#f8b76f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-80%" width="140%" height="260%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".44"/></filter>
    <clipPath id="progress"><rect x="0" y="0" width="770" height="110"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#11100f"/>
