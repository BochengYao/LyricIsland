  <text x="108" y="92" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#fff">Lyric Hover</text>
  <text x="108" y="246" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="#fff">每个字，都跟上声音。</text>
  <text x="112" y="344" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="500" fill="#fff" fill-opacity=".68">未唱的部分轻轻隐在后面，唱到哪里，歌词就亮到哪里。</text>
  <g transform="translate(113 410)" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="0" y="28" font-size="18" font-weight="700" fill="#fff" fill-opacity=".42">00:24</text>
    <rect x="86" y="15" width="440" height="2" rx="1" fill="#fff" fill-opacity=".16"/>
    <rect x="86" y="15" width="255" height="2" rx="1" fill="url(#warm)"/>
    <circle cx="341" cy="16" r="6" fill="#f48769"/>
    <text x="548" y="28" font-size="18" font-weight="700" fill="#fff" fill-opacity=".42">58%</text>
  </g>
  <g transform="translate(174 560) scale(2.8)" filter="url(#shadow)">
    <path d="M0 0H560C532 0 522 5 516 15C512 22 512 34 512 40C512 49 504 55 491 55H69C56 55 48 49 48 40C48 34 48 22 44 15C38 5 28 0 0 0Z" fill="#050505"/>
  </g>
  <g transform="translate(330 612)" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="0" y="58" font-size="45" font-weight="700" letter-spacing="1" fill="#fff" fill-opacity=".34">我把影子留在路灯与雨相遇的地方</text>
    <g clip-path="url(#progress)"><text x="0" y="58" font-size="45" font-weight="700" letter-spacing="1" fill="#fff">我把影子留在路灯与雨相遇的地方</text></g>
    <text x="0" y="100" font-size="20" font-weight="600" fill="#fff" fill-opacity=".38">逐字跟随 · Word-by-word follow</text>
  </g>
  <g transform="translate(112 860)" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <g><circle cx="10" cy="10" r="10" fill="#fff" fill-opacity=".25"/><text x="34" y="18" font-size="22" font-weight="600" fill="#fff" fill-opacity=".62">未唱字词保持低亮</text></g>
    <g transform="translate(350 0)"><circle cx="10" cy="10" r="10" fill="#fff"/><text x="34" y="18" font-size="22" font-weight="600" fill="#fff" fill-opacity=".85">已唱字词逐字点亮</text></g>
    <g transform="translate(735 0)"><circle cx="10" cy="10" r="10" fill="#f48769"/><text x="34" y="18" font-size="22" font-weight="600" fill="#fff" fill-opacity=".62">节奏、停顿与呼吸同步</text></g>
  </g>
  <text x="112" y="1010" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="600" fill="#fff" fill-opacity=".44">不是一条进度条，而是歌词本身在跟随声音。</text>
